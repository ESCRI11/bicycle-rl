<!doctype html>
<meta charset="utf-8">
<title>bike photos — reference pool curation</title>
<style>
  :root { --bg:#0d0d10; --panel:#16161c; --line:#2a2a34; --fg:#e6e6ea; --dim:#8a8a99;
          --keep:#3ddc84; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace }
  header { position:sticky; top:0; z-index:5; display:flex; gap:14px; align-items:center;
           flex-wrap:wrap; padding:10px 14px; background:var(--panel);
           border-bottom:1px solid var(--line) }
  header b { color:var(--keep) }
  #bar { flex:1; min-width:160px; height:6px; background:#22222c; border-radius:3px; overflow:hidden }
  #bar div { height:100%; background:var(--keep); width:0 }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           padding:5px 9px; cursor:pointer; font:12px ui-monospace,monospace }
  button:hover { border-color:var(--fg) }
  button.on { background:var(--fg); color:var(--bg) }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; padding:8px }
  figure { margin:0; min-width:0; position:relative; cursor:pointer; opacity:.42;
           border:2px solid transparent; background:#000 }
  figure.keep { opacity:1; border-color:var(--keep) }
  figure.keep::after { content:'✓'; position:absolute; top:4px; right:6px; color:var(--keep);
                       font-size:18px; text-shadow:0 0 4px #000 }
  img { width:100%; aspect-ratio:4/3; object-fit:contain; display:block }
  figcaption { padding:3px 5px; color:var(--dim); font-size:11px; overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap }
  #zoom { position:fixed; inset:0; z-index:10; background:#000d; display:none;
          align-items:center; justify-content:center; padding:20px }
  #zoom img { max-width:100%; max-height:92vh; width:auto; aspect-ratio:auto; object-fit:contain }
  #zoom.on { display:flex }
  kbd { background:#22222c; border:1px solid var(--line); border-radius:3px; padding:0 4px }
</style>

<header>
  <span id="count">loading…</span>
  <div id="bar"><div></div></div>
  <button id="f-all" class="on">all</button>
  <button id="f-keep">kept</button>
  <button id="f-todo">not kept</button>
  <button id="export">export rejects.txt</button>
  <span style="color:var(--dim)">click = keep · double-click = zoom · <kbd>esc</kbd> closes</span>
</header>

<div id="grid"></div>
<div id="zoom"><img></div>

<script>
const TARGET = 200, KEY = 'bike-photo-pool-v1';
const $ = s => document.querySelector(s);
let files = [], keep = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let filter = 'all';

const save = () => localStorage.setItem(KEY, JSON.stringify([...keep]));

function stats() {
  $('#count').innerHTML = `<b>${keep.size} kept</b> of ${files.length} candidates
    · target ${TARGET} · ${files.length - keep.size} to cull`;
  $('#bar div').style.width = Math.min(100, keep.size / TARGET * 100) + '%';
}

function draw() {
  const show = files.filter(f => filter === 'all' || (filter === 'keep') === keep.has(f));
  $('#grid').innerHTML = show.map(f =>
    `<figure class="${keep.has(f) ? 'keep' : ''}" data-f="${f}">
       <img loading="lazy" src="photos/${encodeURIComponent(f)}">
       <figcaption>${f}</figcaption>
     </figure>`).join('');
  stats();
}

$('#grid').onclick = e => {
  const fig = e.target.closest('figure'); if (!fig) return;
  const f = fig.dataset.f;
  keep.has(f) ? keep.delete(f) : keep.add(f);
  fig.classList.toggle('keep');
  save(); stats();
};
$('#grid').ondblclick = e => {
  const img = e.target.closest('figure')?.querySelector('img'); if (!img) return;
  $('#zoom img').src = img.src;
  $('#zoom').classList.add('on');
};
$('#zoom').onclick = () => $('#zoom').classList.remove('on');
addEventListener('keydown', e => { if (e.key === 'Escape') $('#zoom').classList.remove('on'); });

for (const [id, val] of [['#f-all', 'all'], ['#f-keep', 'keep'], ['#f-todo', 'todo']])
  $(id).onclick = e => {
    filter = val;
    document.querySelectorAll('header button').forEach(b => b.classList.remove('on'));
    e.target.classList.add('on');
    draw();
  };

$('#export').onclick = () => {
  const rejects = files.filter(f => !keep.has(f)).join('\n') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rejects], { type: 'text/plain' }));
  a.download = 'rejects.txt'; a.click();
};

fetch('photos/credits.json')
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(c => { files = Object.keys(c).sort(); draw(); })
  .catch(e => $('#count').innerHTML =
    `cannot load photos/credits.json (${e}) — run <b>python3 -m http.server 8000</b> in bike/`);
</script>

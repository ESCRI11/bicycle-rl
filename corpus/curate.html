<!doctype html>
<meta charset="utf-8">
<title>hydra corpus — curation wireframe</title>
<script src="https://unpkg.com/hydra-synth"></script>
<script src="https://unpkg.com/p5@1.9.4/lib/p5.min.js"></script>
<style>
  :root { --bg:#0d0d10; --panel:#16161c; --line:#2a2a34; --fg:#e6e6ea; --dim:#8a8a99;
          --keep:#3ddc84; --reject:#ff5c5c; --warn:#ffb347; }
  * { box-sizing:border-box }
  body { margin:0; height:100vh; display:grid; grid-template-columns:300px 1fr;
         background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace }
  aside { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0 }
  main  { display:grid; grid-template-rows:minmax(240px,45vh) auto 1fr; min-height:0 }
  h1 { font-size:13px; margin:0; padding:10px 12px; border-bottom:1px solid var(--line); color:var(--dim) }
  .pad { padding:10px 12px; border-bottom:1px solid var(--line) }
  label { display:block; color:var(--dim); cursor:pointer; user-select:none }
  #list { overflow:auto; flex:1 }
  #list div { padding:4px 12px; border-bottom:1px solid #1e1e26; cursor:pointer;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim) }
  #list div.on { background:#22222c; color:var(--fg) }
  #list div.keep { border-left:3px solid var(--keep) }
  #list div.reject { border-left:3px solid var(--reject); opacity:.45 }
  canvas { width:100%; height:100%; display:block; background:#000 }
  #stage { position:relative; background:#000 }
  #cv { position:relative; z-index:1 }
  #err { position:absolute; left:0; right:0; bottom:0; padding:6px 10px; background:#3a1414;
         color:var(--reject); font-size:12px; white-space:pre-wrap; max-height:40%; overflow:auto }
  #meta { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line);
          border-top:1px solid var(--line); flex-wrap:wrap }
  #meta a { color:var(--dim) }
  textarea { width:100%; height:100%; background:var(--panel); color:var(--fg); border:0;
             padding:10px 12px; font:12px/1.5 ui-monospace,monospace; resize:none; outline:none }
  input[type=text] { background:var(--panel); color:var(--fg); border:1px solid var(--line);
                     padding:5px 8px; font:12px ui-monospace,monospace; width:100% }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           padding:5px 9px; cursor:pointer; font:12px ui-monospace,monospace }
  button:hover { border-color:var(--fg) }
  .tag { border-radius:10px }
  .tag.on { background:var(--fg); color:var(--bg) }
  .badge { color:var(--warn); border:1px solid var(--warn); padding:0 5px; border-radius:3px; font-size:11px }
  kbd { background:#22222c; border:1px solid var(--line); border-radius:3px; padding:0 4px }
</style>

<aside>
  <h1>hydra corpus — curation</h1>
  <div class="pad" id="stats">loading…</div>
  <div class="pad">
    <label><input type="checkbox" id="f-input" checked> hide cam/audio/video sketches</label>
    <label><input type="checkbox" id="f-done"> hide decided</label>
    <label><input type="checkbox" id="f-p5"> only p5-in-hydra sketches</label>
    <label><input type="checkbox" id="f-short" checked> shortest first</label>
    <input type="text" id="f-text" placeholder="filter code…" style="margin-top:6px">
  </div>
  <div id="list"></div>
  <div class="pad" style="border-top:1px solid var(--line);border-bottom:0">
    <button id="export">export keeps.jsonl</button>
    <div style="color:var(--dim);margin-top:8px">
      <kbd>k</kbd> keep <kbd>x</kbd> reject <kbd>j</kbd>/<kbd>l</kbd> prev/next<br>
      <kbd>r</kbd> re-render <kbd>ctrl+enter</kbd> run edits
    </div>
  </div>
</aside>

<main>
  <div id="stage"><div id="p5host"></div><canvas id="cv"></canvas><div id="err" hidden></div></div>
  <div id="meta">
    <span id="pos"></span>
    <span id="badges"></span>
    <a id="src" target="_blank" rel="noopener">source</a>
    <span id="lic" style="color:var(--dim)"></span>
    <button id="keep" style="border-color:var(--keep)">keep (k)</button>
    <button id="reject" style="border-color:var(--reject)">reject (x)</button>
    <span id="tags"></span>
    <input type="text" id="prompt" placeholder="prompt: describe this sketch in plain language…"
           style="flex:1;min-width:220px">
  </div>
  <textarea id="code" spellcheck="false"></textarea>
</main>

<script>
const TAGS = ['geometric','organic','glitch','minimal','saturated','feedback','strobe','slow'];
const KEY = 'hydra-curation-v1';
const $ = s => document.querySelector(s);
let all = [], view = [], i = 0;
let dec = JSON.parse(localStorage.getItem(KEY) || '{}');   // id -> {v, prompt, tags, code}
const save = () => localStorage.setItem(KEY, JSON.stringify(dec));
const cur = () => view[i];
const d = id => (dec[id] ||= { v:null, prompt:'', tags:[], code:null });

// --- hydra -------------------------------------------------------------------
const cv = $('#cv');
cv.width = cv.clientWidth; cv.height = cv.clientHeight;   // else hydra renders 300x150 and upscales
const hydra = new Hydra({ canvas: cv, detectAudio:false, makeGlobal:true,
                          enableStreamCapture:false });
addEventListener('resize', () => hydra.setResolution(cv.clientWidth, cv.clientHeight));
// the hydra editor's p5 wrapper, inlined: sketches say `p1 = new P5()` and then feed
// p1.canvas to a hydra source. p5 is how a sketch gets text, geometry and typography
// that the GLSL chain cannot express, so the preview has to support it.
const p5lib = window.p5, p5s = [];
window.P5 = class P5 extends p5lib {
  constructor({ width = cv.clientWidth, height = cv.clientHeight, mode = 'P2D' } = {}) {
    super(p => { p.setup = () => p.createCanvas(width, height, p[mode]); p.draw = () => {}; }, 'p5host');
    this.width = width; this.height = height;
    Object.assign(this.canvas.style, { position:'absolute', top:0, left:0 });
    p5s.push(this);
  }
  show() { this.canvas.style.visibility = 'visible'; }
  hide() { this.canvas.style.visibility = 'hidden'; }
  clear() { this.drawingContext.clearRect(0, 0, this.canvas.width, this.canvas.height); }
};
const loaded = {};                                            // `await loadScript(url)`, as in the editor
window.loadScript = url => loaded[url] ||= new Promise((ok, no) => {
  const el = document.createElement('script');
  el.src = url; el.onload = ok; el.onerror = () => no(new Error('failed to load ' + url));
  document.head.appendChild(el);
});
window.__err = e => showErr(e.message || String(e));
addEventListener('error', e => showErr(e.message));          // per-frame arrow-fn blowups
function showErr(m) { const el = $('#err'); el.hidden = !m; el.textContent = m || ''; }
function run(code) {
  showErr('');
  p5s.splice(0).forEach(p => { try { p.remove(); } catch {} });   // one sketch's p5 canvas is not the next one's
  window.p5 = p5lib;                                              // sketches that do `p5 = new P5()` clobber the lib
  try {
    hush(); speed = 1; bpm = 30;
    // async wrapper so a sketch can `await loadScript(...)` at the top, like in the editor
    (0, eval)(`(async () => {\n${code}\n})().catch(window.__err)`);
  } catch (e) { showErr(e.message); }
}

// --- rendering the ui --------------------------------------------------------
function applyFilters() {
  const t = $('#f-text').value.toLowerCase();
  view = all.filter(r => !($('#f-input').checked && r.needs_input)
                      && !($('#f-p5').checked && !r.uses_p5)
                      && !($('#f-done').checked && dec[r.id]?.v)
                      && (!t || r.code.toLowerCase().includes(t)));
  if ($('#f-short').checked) view.sort((a, b) => a.code.length - b.code.length);
  i = Math.min(i, Math.max(0, view.length - 1));
}
function drawList() {
  $('#list').innerHTML = view.map((r, n) =>
    `<div class="${n === i ? 'on ' : ''}${dec[r.id]?.v || ''}" data-n="${n}">${
      n} ${r.code.split('\n').find(l => l.trim()) .slice(0, 40).replace(/[<>&]/g, '')}</div>`).join('');
  $('#list div.on')?.scrollIntoView({ block:'nearest' });
  const k = Object.values(dec).filter(x => x.v === 'keep');
  $('#stats').innerHTML = `${all.length} candidates (${all.filter(r => r.uses_p5).length} p5)
    · <b style="color:var(--keep)">${k.length} kept</b>
    · ${Object.values(dec).filter(x => x.v === 'reject').length} rejected
    · ${k.filter(x => !x.prompt.trim()).length} kept without prompt`;
}
function show() {
  const r = cur(); if (!r) { $('#pos').textContent = 'nothing matches the filters'; return; }
  const s = d(r.id);
  $('#pos').textContent = `${i + 1}/${view.length}`;
  $('#src').href = r.source; $('#lic').textContent = r.license;
  $('#badges').innerHTML = [r.needs_input && 'needs input', r.uses_p5 && 'p5']
    .filter(Boolean).map(b => `<span class="badge">${b}</span>`).join(' ');
  $('#code').value = s.code ?? r.code;
  $('#prompt').value = s.prompt;
  $('#tags').innerHTML = TAGS.map(t =>
    `<button class="tag ${s.tags.includes(t) ? 'on' : ''}" data-t="${t}">${t}</button>`).join(' ');
  run($('#code').value);
  drawList();
}
function go(n) { i = Math.max(0, Math.min(view.length - 1, n)); show(); }
function verdict(v) {
  const r = cur(); if (!r) return;
  const s = d(r.id);
  s.v = v; s.prompt = $('#prompt').value; s.code = $('#code').value;
  save(); go(i + 1);
}

// --- events ------------------------------------------------------------------
$('#keep').onclick = () => verdict('keep');
$('#reject').onclick = () => verdict('reject');
$('#list').onclick = e => { const n = e.target.dataset.n; if (n !== undefined) go(+n); };
$('#tags').onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  const s = d(cur().id), at = s.tags.indexOf(t);
  at < 0 ? s.tags.push(t) : s.tags.splice(at, 1);
  save(); e.target.classList.toggle('on');
};
$('#prompt').onchange = () => { d(cur().id).prompt = $('#prompt').value; save(); };
for (const f of ['#f-input', '#f-p5', '#f-done', '#f-short', '#f-text'])
  $(f).oninput = () => { applyFilters(); show(); };
$('#code').onkeydown = e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    d(cur().id).code = $('#code').value; save(); run($('#code').value);
  }
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = { k: () => verdict('keep'), x: () => verdict('reject'),
              j: () => go(i - 1), l: () => go(i + 1), r: () => run($('#code').value) }[e.key];
  if (k) { e.preventDefault(); k(); }
});
$('#export').onclick = () => {
  const out = all.filter(r => dec[r.id]?.v === 'keep').map(r => JSON.stringify({
    id: r.id, prompt: dec[r.id].prompt.trim(), code: (dec[r.id].code ?? r.code).trim(),
    tags: dec[r.id].tags, source: r.source, license: r.license,
  })).join('\n') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type:'application/x-ndjson' }));
  a.download = 'keeps.jsonl'; a.click();
};

// --- boot --------------------------------------------------------------------
fetch('candidates.jsonl')
  .then(r => r.ok ? r.text() : Promise.reject(r.status))
  .then(t => {
    all = t.trim().split('\n').map(JSON.parse);
    applyFilters(); show();
  })
  .catch(e => $('#stats').innerHTML =
    `cannot load candidates.jsonl (${e}).<br>run <b>python3 -m http.server 8000</b> in corpus/
     and open <a href="http://localhost:8000/curate.html">localhost:8000/curate.html</a>`);
</script>
